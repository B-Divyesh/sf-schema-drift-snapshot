<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Schema Drift Snapshot demo terminal recording</title>
  <desc id="desc">The sds demo command writes five classified differences and a Markdown review to a temporary sandbox.</desc>
  <rect width="760" height="280" fill="#102f35"/>
  <rect x="1" y="1" width="758" height="278" fill="none" stroke="#8ea9a5" stroke-opacity=".7"/>
  <circle cx="28" cy="26" r="5" fill="#c34f3d"/>
  <circle cx="46" cy="26" r="5" fill="#d5a649"/>
  <circle cx="64" cy="26" r="5" fill="#70a287"/>
  <path d="M0 48h760" stroke="#fffdf7" stroke-opacity=".28"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
    <text x="26" y="85" fill="#eda89c">$</text>
    <text x="48" y="85" fill="#fffdf7">sds demo</text>
    <text x="26" y="124" fill="#d7e3e0">Demo — sample data, nothing is saved to your database.</text>
    <text x="26" y="163" fill="#fffdf7">Wrote 5 classified differences to</text>
    <text x="26" y="193" fill="#b9d1cd">/tmp/schema-drift-snapshot-demo-…/drift-review.md</text>
    <text x="26" y="238" fill="#b9d1cd">Sandbox: /tmp/schema-drift-snapshot-demo-…</text>
  </g>
</svg>
